<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Touch Mrs.Andi</title>
    <meta name="description" content="Welcome to my personal page">
    
    <!-- 基本Meta标签 -->
    <meta name="robots" content="index, follow">
    <meta name="referrer" content="no-referrer-when-downgrade">
    
    <style>
        /* 基础样式重置 - 移动端优化 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #000000;
            color: #ffffff;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
        }
        
        /* 顶部进度条 */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background: linear-gradient(90deg, #0088cc, #00aaff);
            z-index: 1000;
            transition: width 0.3s ease;
            border-radius: 0 2px 2px 0;
        }
        
        .progress-bar.active {
            width: 100%;
            transition: width 1.5s cubic-bezier(0.65, 0, 0.35, 1);
        }
        
        /* 主容器 */
        .main-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            padding: 0 15px;
            animation: fadeIn 0.6s ease-out;
        }
        
        /* 圆形图片容器 */
        .image-container {
            position: relative;
            width: 70vw;
            height: 70vw;
            max-width: 300px;
            max-height: 300px;
            margin: 0 auto 25px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            background-color: #1a1a1a;
        }
        
        /* 圆形图片 */
        .main-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        /* 标题样式 */
        .title {
            font-size: clamp(26px, 7vw, 36px);
            font-weight: 700;
            margin-bottom: 12px;
            color: white;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }
        
        /* 副标题样式 */
        .subtitle {
            font-size: clamp(14px, 4vw, 17px);
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 30px;
            padding: 0 10px;
            line-height: 1.4;
            font-weight: 300;
        }
        
        /* 按钮容器 */
        .buttons-container {
            width: 100%;
            max-width: 320px;
            margin: 0 auto 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        /* 按钮样式 */
        .action-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 20px;
            background-color: white;
            color: #000000;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: clamp(16px, 4.5vw, 17px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            position: relative;
            overflow: hidden;
        }
        
        /* 第二个按钮样式 */
        .action-button.telegram {
            background: linear-gradient(135deg, #0088cc 0%, #006699 100%);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        /* 按钮图标 */
        .button-icon {
            width: 22px;
            height: 22px;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 按钮文本 */
        .button-text {
            flex: 1;
            text-align: center;
        }
        
        /* 按钮点击效果 */
        .action-button:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        
        /* 按钮加载状态 */
        .action-button.loading {
            position: relative;
            overflow: hidden;
        }
        
        .action-button.loading::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: loadingShimmer 1.5s infinite;
        }
        
        /* 页脚 */
        .footer {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: clamp(13px, 3.5vw, 15px);
            padding: 10px 15px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
        }
        
        /* 背景 */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            z-index: -1;
        }
        
        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes loadingShimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        /* 小屏幕优化 */
        @media (max-width: 320px) {
            .image-container {
                width: 75vw;
                height: 75vw;
                max-width: 250px;
                max-height: 250px;
                margin-bottom: 20px;
            }
            
            .subtitle {
                margin-bottom: 25px;
            }
            
            .action-button {
                padding: 14px 18px;
            }
            
            .buttons-container {
                gap: 12px;
            }
        }
        
        /* 平板 */
        @media (min-width: 768px) {
            .main-container {
                max-width: 420px;
            }
            
            .image-container {
                max-width: 300px;
                max-height: 300px;
            }
            
            .buttons-container {
                max-width: 350px;
            }
        }
        
        /* 防止文字选择 */
        .title, .subtitle, .footer, .action-button {
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <!-- 顶部进度条 -->
    <div class="progress-bar" id="progressBar"></div>
    
    <!-- 背景 -->
    <div class="background"></div>
    
    <!-- 主容器 -->
    <div class="main-container">
        <!-- 圆形图片容器 -->
        <div class="image-container">
            <img src="images/1.jpg" alt="Mrs.Andi's profile" class="main-image" loading="lazy">
        </div>
        
        <!-- 标题和描述 -->
        <h1 class="title">Mrs.Andi</h1>
        <p class="subtitle">I update my status daily; feel free to check it out if you like.</p>
        
        <!-- 按钮容器 -->
        <div class="buttons-container">
            <!-- 第一个按钮 -->
            <a href="https://y29v.com/l/HNLpDgZd" 
               class="action-button" 
               id="contentButton"
               target="_blank"
               rel="noopener noreferrer">
                <span class="button-icon">🔍</span>
                <span class="button-text">Explore Content</span>
            </a>
            
            <!-- 第二个按钮 -->
            <button class="action-button telegram" id="telegramButton">
                <span class="button-icon">📢</span>
                <span class="button-text">My Channel</span>
            </button>
        </div>
        
        <!-- 页脚 -->
        <div class="footer">
            © 2026 Mrs.Andi. All rights reserved.
        </div>
    </div>

    <script>
        (function() {
            'use strict';
            
            // 配置
            const config = {
                telegramUrl: 'https://t.me/+lZH64VGQTDM0NjFl',
                isRedirecting: false
            };
            
            // DOM元素
            const progressBar = document.getElementById('progressBar');
            const telegramButton = document.getElementById('telegramButton');
            
            // 显示进度条
            function showProgressBar() {
                progressBar.classList.remove('active');
                // 触发重绘
                void progressBar.offsetWidth;
                progressBar.classList.add('active');
            }
            
            // 隐藏进度条
            function hideProgressBar() {
                progressBar.classList.remove('active');
            }
            
            // 安全跳转函数
            function safeRedirect(url) {
                return new Promise((resolve) => {
                    // 尝试直接打开新窗口
                    const newWindow = window.open(url, '_blank', 'noopener,noreferrer');
                    
                    if (newWindow) {
                        // 成功打开新窗口
                        console.log('New window opened successfully');
                        resolve(true);
                    } else {
                        // 弹窗被阻止，使用备用方法
                        console.log('Popup blocked, using fallback method');
                        
                        // 创建隐藏链接点击
                        const tempLink = document.createElement('a');
                        tempLink.href = url;
                        tempLink.target = '_blank';
                        tempLink.rel = 'noopener noreferrer';
                        tempLink.style.display = 'none';
                        document.body.appendChild(tempLink);
                        
                        // 触发点击
                        tempLink.click();
                        
                        // 清理
                        setTimeout(() => {
                            document.body.removeChild(tempLink);
                        }, 100);
                        
                        resolve(true);
                    }
                });
            }
            
            // 初始化第一个按钮
            function initContentButton() {
                const button = document.getElementById('contentButton');
                
                button.addEventListener('click', function() {
                    // 显示进度条
                    showProgressBar();
                    
                    // 进度条完成后自动隐藏
                    setTimeout(() => {
                        hideProgressBar();
                    }, 1500);
                });
            }
            
            // 初始化Telegram按钮
            function initTelegramButton() {
                telegramButton.addEventListener('click', async function(e) {
                    e.preventDefault();
                    
                    // 防止重复点击
                    if (config.isRedirecting) return;
                    config.isRedirecting = true;
                    
                    // 显示加载状态
                    this.classList.add('loading');
                    this.disabled = true;
                    
                    // 显示进度条
                    showProgressBar();
                    
                    try {
                        // 短暂延迟让用户看到进度条
                        await new Promise(resolve => setTimeout(resolve, 300));
                        
                        // 执行跳转
                        await safeRedirect(config.telegramUrl);
                        
                        // 跳转成功，进度条继续走完
                        setTimeout(() => {
                            // 恢复按钮状态
                            this.classList.remove('loading');
                            this.disabled = false;
                            config.isRedirecting = false;
                            
                            // 隐藏进度条
                            hideProgressBar();
                        }, 1200);
                        
                    } catch (error) {
                        console.error('Redirect error:', error);
                        
                        // 出错时隐藏进度条
                        hideProgressBar();
                        
                        // 恢复按钮状态
                        this.classList.remove('loading');
                        this.disabled = false;
                        config.isRedirecting = false;
                        
                        // 显示错误提示（可选）
                        alert('Unable to open Telegram. Please try again.');
                    }
                });
            }
            
            // 图片加载处理
            function initImageLoading() {
                const img = document.querySelector('.main-image');
                
                img.addEventListener('load', function() {
                    this.style.opacity = '1';
                });
                
                img.addEventListener('error', function() {
                    // 创建备用头像
                    const canvas = document.createElement('canvas');
                    canvas.width = 400;
                    canvas.height = 400;
                    const ctx = canvas.getContext('2d');
                    
                    // 绘制圆形背景
                    ctx.fillStyle = '#1a1a1a';
                    ctx.fillRect(0, 0, 400, 400);
                    
                    // 绘制白色圆形边框
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(200, 200, 196, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    // 绘制文字
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 80px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('MA', 200, 200);
                    
                    this.src = canvas.toDataURL('image/png');
                    this.style.opacity = '1';
                });
            }
            
            // 防止右键检查
            function preventInspection() {
                document.addEventListener('contextmenu', function(e) {
                    if (e.target.closest('.action-button')) {
                        e.preventDefault();
                    }
                });
                
                document.addEventListener('dragstart', function(e) {
                    if (e.target.closest('.action-button')) {
                        e.preventDefault();
                    }
                });
            }
            
            // 页面加载完成
            document.addEventListener('DOMContentLoaded', function() {
                initContentButton();
                initTelegramButton();
                initImageLoading();
                preventInspection();
                
                console.log('Page loaded successfully');
            });
            
            // 页面离开时重置状态
            window.addEventListener('beforeunload', function() {
                config.isRedirecting = false;
            });
            
            // 页面可见性变化
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    // 页面隐藏时重置
                    config.isRedirecting = false;
                    telegramButton.classList.remove('loading');
                    telegramButton.disabled = false;
                    hideProgressBar();
                }
            });
            
        })();
    </script>
</body>
</html>
