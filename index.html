<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mrs.Andi</title>
    <meta name="description" content="Welcome to my personal page">
    
    <!-- 基本Meta标签 -->
    <meta name="robots" content="index, follow">
    <meta name="referrer" content="no-referrer-when-downgrade">
    
    <style>
        /* 基础样式重置 - 移动端优化 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #000000;
            color: #ffffff;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-x: hidden;
            overflow-y: auto;
        }
        
        /* 主容器 */
        .main-container {
            width: 100%;
            max-width: 100%;
            text-align: center;
            padding: 0 15px;
            max-height: 90vh; /* 限制最大高度 */
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        /* 滚动容器 - 内容区域 */
        .scroll-content {
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 5px;
            -webkit-overflow-scrolling: touch;
        }
        
        /* 圆形图片容器 */
        .image-container {
            position: relative;
            width: 70vw;
            height: 70vw;
            max-width: 300px;
            max-height: 300px;
            margin: 0 auto 25px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            background-color: #1a1a1a;
            flex-shrink: 0;
        }
        
        /* 圆形图片 */
        .main-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        /* 标题样式 */
        .title {
            font-size: clamp(26px, 7vw, 36px);
            font-weight: 700;
            margin-bottom: 12px;
            color: white;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }
        
        /* 副标题样式 */
        .subtitle {
            font-size: clamp(14px, 4vw, 17px);
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 30px;
            padding: 0 10px;
            line-height: 1.4;
            font-weight: 300;
        }
        
        /* 按钮容器 */
        .buttons-container {
            width: 100%;
            max-width: 320px;
            margin: 0 auto 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }
        
        /* 按钮样式 */
        .action-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 20px;
            background-color: white;
            color: #000000;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: clamp(16px, 4.5vw, 17px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            position: relative;
            overflow: hidden;
        }
        
        /* 第二个按钮样式 */
        .action-button.telegram {
            background: linear-gradient(135deg, #0088cc 0%, #006699 100%);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        /* 按钮图标 */
        .button-icon {
            width: 22px;
            height: 22px;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 按钮文本 */
        .button-text {
            flex: 1;
            text-align: center;
        }
        
        /* 点击效果 */
        .action-button:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        
        /* 加载状态 */
        .action-button.loading {
            opacity: 0.8;
            pointer-events: none;
        }
        
        .action-button.loading .button-text {
            opacity: 0.7;
        }
        
        .action-button.loading::after {
            content: "";
            position: absolute;
            right: 20px;
            width: 18px;
            height: 18px;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        /* 成功状态 */
        .action-button.success {
            background-color: #4CAF50;
            color: white;
        }
        
        /* 状态提示 */
        .status-message {
            font-size: 14px;
            color: #4CAF50;
            margin-top: 5px;
            height: 18px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .status-message.show {
            opacity: 1;
        }
        
        .status-message.error {
            color: #ff4444;
        }
        
        /* 页脚 */
        .footer {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: clamp(13px, 3.5vw, 15px);
            padding: 10px 15px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
        }
        
        /* 背景 */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            z-index: -1;
        }
        
        /* 动画 */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        /* 小屏幕优化 */
        @media (max-width: 320px) {
            .image-container {
                width: 75vw;
                height: 75vw;
                max-width: 250px;
                max-height: 250px;
                margin-bottom: 20px;
            }
            
            .subtitle {
                margin-bottom: 25px;
            }
            
            .action-button {
                padding: 14px 18px;
            }
            
            .buttons-container {
                gap: 12px;
            }
        }
        
        /* 平板 */
        @media (min-width: 768px) {
            .main-container {
                max-width: 500px;
            }
            
            .image-container {
                max-width: 280px;
                max-height: 280px;
            }
        }
        
        /* 横屏模式 */
        @media (orientation: landscape) and (max-height: 500px) {
            .main-container {
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 25px;
                max-height: 85vh;
            }
            
            .image-container {
                width: 40vh;
                height: 40vh;
                max-width: 200px;
                max-height: 200px;
                margin-bottom: 0;
                flex-shrink: 0;
            }
            
            .scroll-content {
                flex: 1;
                max-height: 60vh;
                text-align: left;
            }
            
            .title, .subtitle {
                text-align: left;
                padding-left: 0;
            }
            
            .buttons-container {
                max-width: 100%;
            }
        }
        
        /* 防止文字选择 */
        .title, .subtitle, .footer, .action-button {
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <!-- 背景 -->
    <div class="background"></div>
    
    <!-- 主容器 -->
    <div class="main-container">
        <!-- 圆形图片容器 -->
        <div class="image-container">
            <img src="images/1.jpg" alt="Mrs.Andi's profile" class="main-image" loading="lazy">
        </div>
        
        <!-- 滚动内容区域 -->
        <div class="scroll-content">
            <!-- 标题和描述 -->
            <h1 class="title">Mrs.Andi</h1>
            <p class="subtitle">I update my status daily; feel free to check it out if you like.</p>
            
            <!-- 按钮容器 -->
            <div class="buttons-container">
                <!-- 第一个按钮 -->
                <a href="https://p78t.com/l/RxpRypfz" 
                   class="action-button" 
                   id="contentButton"
                   target="_blank"
                   rel="noopener noreferrer">
                    <span class="button-icon">🔍</span>
                    <span class="button-text">Explore Content</span>
                </a>
                
                <!-- 状态提示 -->
                <div class="status-message" id="contentStatus"></div>
                
                <!-- 第二个按钮 -->
                <button class="action-button telegram" id="telegramButton">
                    <span class="button-icon">📢</span>
                    <span class="button-text">My Channel</span>
                </button>
                
                <!-- 状态提示 -->
                <div class="status-message" id="telegramStatus"></div>
            </div>
        </div>
        
        <!-- 页脚 -->
        <div class="footer">
            © 2026 Mrs.Andi. All rights reserved.
        </div>
    </div>

    <script>
        (function() {
            'use strict';
            
            // 配置
            const config = {
                telegramUrl: 'https://t.me/+lZH64VGQTDM0NjFl',
                isRedirecting: false,
                redirectDelay: 800 // 延迟时间（毫秒）
            };
            
            // 状态管理
            const state = {
                telegramClicked: false
            };
            
            // 初始化第一个按钮
            function initContentButton() {
                const button = document.getElementById('contentButton');
                const status = document.getElementById('contentStatus');
                
                button.addEventListener('click', function(e) {
                    // 显示点击反馈
                    this.classList.add('loading');
                    showStatus(status, 'Opening content...', 'success');
                    
                    // 短暂延迟后恢复
                    setTimeout(() => {
                        this.classList.remove('loading');
                        clearStatus(status, 1000);
                    }, 1000);
                });
            }
            
            // 初始化Telegram按钮
            function initTelegramButton() {
                const button = document.getElementById('telegramButton');
                const status = document.getElementById('telegramStatus');
                
                button.addEventListener('click', async function(e) {
                    e.preventDefault();
                    
                    // 防止重复点击
                    if (config.isRedirecting) return;
                    config.isRedirecting = true;
                    
                    // 更新按钮状态
                    this.classList.add('loading');
                    showStatus(status, 'Opening Telegram channel...', 'success');
                    
                    try {
                        // 方法1：优先使用直接跳转（最可靠）
                        await redirectWithFeedback(config.telegramUrl, button, status);
                        
                    } catch (error) {
                        console.error('Redirect failed:', error);
                        showStatus(status, 'Failed to open. Please try again.', 'error');
                        
                        // 恢复按钮状态
                        setTimeout(() => {
                            button.classList.remove('loading');
                            clearStatus(status, 2000);
                            config.isRedirecting = false;
                        }, 2000);
                    }
                });
            }
            
            // 带反馈的跳转函数
            async function redirectWithFeedback(url, button, status) {
                return new Promise((resolve, reject) => {
                    // 短延迟给用户看到反馈
                    setTimeout(() => {
                        try {
                            // 记录点击时间
                            const clickTime = Date.now();
                            localStorage.setItem('last_click_time', clickTime);
                            
                            // 现代浏览器推荐的方法 - 直接在新标签打开
                            const newWindow = window.open(url, '_blank', 'noopener,noreferrer');
                            
                            if (newWindow) {
                                // 成功打开新窗口
                                showStatus(status, 'Opened successfully!', 'success');
                                
                                // 更新按钮为成功状态
                                button.classList.remove('loading');
                                button.classList.add('success');
                                button.innerHTML = '<span class="button-icon">✓</span><span class="button-text">Channel Opened</span>';
                                
                                // 几秒后恢复原状
                                setTimeout(() => {
                                    button.classList.remove('success');
                                    button.innerHTML = '<span class="button-icon">📢</span><span class="button-text">My Channel</span>';
                                    clearStatus(status, 0);
                                    config.isRedirecting = false;
                                }, 2000);
                                
                                resolve();
                            } else {
                                // 弹窗被阻止，使用备用方案
                                backupRedirect(url, button, status, resolve, reject);
                            }
                        } catch (error) {
                            reject(error);
                        }
                    }, config.redirectDelay);
                });
            }
            
            // 备用跳转方案
            function backupRedirect(url, button, status, resolve, reject) {
                showStatus(status, 'Opening in new tab...', 'success');
                
                // 创建临时链接元素
                const tempLink = document.createElement('a');
                tempLink.href = url;
                tempLink.target = '_blank';
                tempLink.rel = 'noopener noreferrer';
                tempLink.style.display = 'none';
                document.body.appendChild(tempLink);
                
                // 模拟点击
                tempLink.click();
                
                // 清理
                setTimeout(() => {
                    document.body.removeChild(tempLink);
                }, 100);
                
                // 显示成功状态
                setTimeout(() => {
                    showStatus(status, 'Please check your browser tabs', 'success');
                    
                    // 恢复按钮状态
                    button.classList.remove('loading');
                    clearStatus(status, 3000);
                    config.isRedirecting = false;
                    resolve();
                }, 500);
            }
            
            // 显示状态消息
            function showStatus(element, message, type) {
                element.textContent = message;
                element.classList.remove('error');
                if (type === 'error') {
                    element.classList.add('error');
                }
                element.classList.add('show');
            }
            
            // 清除状态消息
            function clearStatus(element, delay = 0) {
                setTimeout(() => {
                    element.classList.remove('show');
                    element.textContent = '';
                }, delay);
            }
            
            // 图片加载处理
            function initImageLoading() {
                const img = document.querySelector('.main-image');
                
                img.addEventListener('load', function() {
                    this.style.opacity = '1';
                });
                
                img.addEventListener('error', function() {
                    // 创建备用头像
                    const canvas = document.createElement('canvas');
                    canvas.width = 300;
                    canvas.height = 300;
                    const ctx = canvas.getContext('2d');
                    
                    // 绘制圆形背景
                    ctx.fillStyle = '#1a1a1a';
                    ctx.fillRect(0, 0, 300, 300);
                    
                    // 绘制白色圆形边框
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(150, 150, 146, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    // 绘制文字
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 60px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('MA', 150, 150);
                    
                    this.src = canvas.toDataURL('image/png');
                    this.style.opacity = '1';
                });
            }
            
            // 防止右键检查
            function preventInspection() {
                document.addEventListener('contextmenu', function(e) {
                    if (e.target.closest('.action-button')) {
                        e.preventDefault();
                    }
                });
                
                document.addEventListener('dragstart', function(e) {
                    if (e.target.closest('.action-button')) {
                        e.preventDefault();
                    }
                });
            }
            
            // 页面加载完成
            document.addEventListener('DOMContentLoaded', function() {
                initContentButton();
                initTelegramButton();
                initImageLoading();
                preventInspection();
                
                // 添加微互动
                setTimeout(() => {
                    document.querySelector('.main-container').style.animation = 'fadeIn 0.6s ease-out';
                }, 100);
                
                console.log('Page loaded successfully');
            });
            
            // 页面可见性变化
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    // 页面重新显示，重置状态
                    config.isRedirecting = false;
                }
            });
            
        })();
    </script>
</body>
</html>
